<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .box {
      background: white;
      padding: 24px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.5rem;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.9rem;
      color: #555;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    input.error {
      border-color: red;
    }

    .error-msg {
      color: red;
      font-size: 0.78rem;
      margin-bottom: 12px;
      min-height: 16px;
      display: block;
    }

    .tip-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .tip-btn {
      padding: 8px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .tip-btn.active {
      background: #4caf50;
      color: white;
      border-color: #4caf50;
    }

    .result-box {
      background: #f0f9f0;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: #333;
    }

    .result-row span:last-child {
      font-weight: bold;
    }

    .per-person {
      font-size: 1.1rem;
      color: #2e7d32;
    }

    .note {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
    }

    button#reset {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: #eee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button#reset:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
<div class="box">
  <h1>Tip Calculator</h1>

  <label>Bill Amount ($)</label>
  <input type="number" id="bill" placeholder="e.g. 50" min="0" step="0.01" />
  <span class="error-msg" id="bill-err"></span>

  <label>Tip %</label>
  <div class="tip-buttons">
    <button class="tip-btn" data-val="10">10%</button>
    <button class="tip-btn active" data-val="15">15%</button>
    <button class="tip-btn" data-val="20">20%</button>
    <button class="tip-btn" data-val="custom">Custom</button>
  </div>
  <input type="number" id="custom-tip" placeholder="Enter custom %" min="0" style="display:none" />
  <span class="error-msg" id="tip-err"></span>

  <label>Number of People</label>
  <input type="number" id="people" placeholder="e.g. 3" min="1" value="1" />
  <span class="error-msg" id="people-err"></span>

  <div class="result-box">
    <div class="result-row">
      <span>Tip Amount</span>
      <span id="out-tip">$0.00</span>
    </div>
    <div class="result-row">
      <span>Total (Bill + Tip)</span>
      <span id="out-total">$0.00</span>
    </div>
    <div class="result-row per-person">
      <span>Per Person</span>
      <span id="out-per">$0.00</span>
    </div>
    <div class="note" id="out-note"></div>
  </div>

  <button id="reset">Reset</button>
</div>

<script>
  const billInput  = document.getElementById('bill');
  const peopleInput= document.getElementById('people');
  const customTip  = document.getElementById('custom-tip');
  const tipBtns    = document.querySelectorAll('.tip-btn');
  const outTip     = document.getElementById('out-tip');
  const outTotal   = document.getElementById('out-total');
  const outPer     = document.getElementById('out-per');
  const outNote    = document.getElementById('out-note');

  let tipValue = 15;

  tipBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tipBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.val === 'custom') {
        customTip.style.display = 'block';
        tipValue = parseFloat(customTip.value) || 0;
        customTip.focus();
      } else {
        customTip.style.display = 'none';
        tipValue = parseFloat(btn.dataset.val);
      }
      calculate();
    });
  });

  customTip.addEventListener('input', () => {
    tipValue = parseFloat(customTip.value) || 0;
    calculate();
  });

  billInput.addEventListener('input', calculate);
  peopleInput.addEventListener('input', calculate);

  function validate() {
    let ok = true;

    const bill = parseFloat(billInput.value);
    const billErr = document.getElementById('bill-err');
    if (billInput.value !== '' && (isNaN(bill) || bill < 0)) {
      billErr.textContent = 'Please enter a valid bill amount.';
      billInput.classList.add('error');
      ok = false;
    } else {
      billErr.textContent = '';
      billInput.classList.remove('error');
    }

    const people = parseInt(peopleInput.value);
    const peopleErr = document.getElementById('people-err');
    if (peopleInput.value !== '' && (isNaN(people) || people < 1)) {
      peopleErr.textContent = 'Number of people must be at least 1.';
      peopleInput.classList.add('error');
      ok = false;
    } else {
      peopleErr.textContent = '';
      peopleInput.classList.remove('error');
    }

    const tipErr = document.getElementById('tip-err');
    if (customTip.style.display === 'block' && customTip.value !== '' && tipValue < 0) {
      tipErr.textContent = 'Tip cannot be negative.';
      ok = false;
    } else {
      tipErr.textContent = '';
    }

    return ok;
  }

  function fmt(n) {
    return '$' + n.toFixed(2);
  }

  function calculate() {
    if (!validate()) return;

    const bill   = parseFloat(billInput.value) || 0;
    const people = Math.max(1, parseInt(peopleInput.value) || 1);
    const tip    = tipValue;

    const tipAmt   = bill * (tip / 100);
    const total    = bill + tipAmt;
    const rawPer   = total / people;
    const perPerson = Math.ceil(rawPer * 100) / 100;
    const extra     = parseFloat((perPerson * people - total).toFixed(2));

    outTip.textContent   = fmt(tipAmt);
    outTotal.textContent = fmt(total);
    outPer.textContent   = fmt(perPerson);

    if (people > 1 && extra > 0) {
      outNote.textContent = 'Rounded up so the group does not underpay. Last person pays ' + fmt(perPerson - extra) + '.';
    } else {
      outNote.textContent = '';
    }
  }

  document.getElementById('reset').addEventListener('click', () => {
    billInput.value    = '';
    peopleInput.value  = '1';
    customTip.value    = '';
    customTip.style.display = 'none';
    tipBtns.forEach(b => b.classList.remove('active'));
    document.querySelector('[data-val="15"]').classList.add('active');
    tipValue = 15;
    ['bill-err','tip-err','people-err'].forEach(id => {
      document.getElementById(id).textContent = '';
    });
    [billInput, peopleInput, customTip].forEach(el => el.classList.remove('error'));
    outTip.textContent = outTotal.textContent = outPer.textContent = '$0.00';
    outNote.textContent = '';
  });

  calculate();
</script>
</body>
</html>
